name: Deploy Gemini Motors Goa to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Prerender SEO route HTML
        run: |
          node scripts/prerender-seo.mjs
          node scripts/prerender-jsonld.mjs
          node scripts/verify-seo-dist.mjs
          node scripts/verify-jsonld-dist.mjs

      - name: Add static route entry points
        run: |
          # Preserve route-specific prerendered HTML. Only fill routes that
          # do not already have an index.html.
          routes=(
            "spare-parts"
            "commercial"
            "commercial/light"
            "commercial/medium-heavy"
            "electric-mobility"
            "services"
            "green-technologies"
            "about"
            "contact"
            "privacy-policy"
            "terms-and-conditions"
          )

          for route in "${routes[@]}"; do
            mkdir -p "dist/$route"
            if [ ! -f "dist/$route/index.html" ]; then
              cp dist/index.html "dist/$route/index.html"
            fi
          done

          # Ensure every sitemap URL has a real Pages entry point so direct
          # product URLs return HTTP 200 rather than the GitHub Pages 404 shell.
          while IFS= read -r url; do
            route="${url#https://geminimotorsgoa.in/}"
            route="${route%/}"
            [ -z "$route" ] && continue

            if [ "$route" = "lcvlandingpage" ] && [ -f "dist/lcv/index.html" ]; then
              mkdir -p "dist/lcvlandingpage"
              cp dist/lcv/index.html "dist/lcvlandingpage/index.html"
              continue
            fi

            mkdir -p "dist/$route"
            if [ ! -f "dist/$route/index.html" ]; then
              cp dist/index.html "dist/$route/index.html"
            fi
          done < <(grep -oE '<loc>https://geminimotorsgoa\.in/[^<]*</loc>' dist/sitemap.xml | sed -E 's#</?loc>##g')

          # Fallback for unknown URLs only.
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
